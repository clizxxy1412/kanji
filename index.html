<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kanji</title>
<meta name="theme-color" content="#1f3140">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanji">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<style>
:root {
  --paper: #f6f5ef;
  --surface: #fdfcf8;
  --ink: #1e1c17;
  --ink-soft: #6e6b5f;
  --indigo: #1f3140;
  --indigo-soft: #35495a;
  --red: #b8002a;
  --red-pale: #f2dade;
  --border: #dcd8c8;
  --border-strong: #b9b4a0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
}

.jp {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input {
  font-family: inherit;
}

#app {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header.top {
  background: var(--indigo);
  color: #f6f5ef;
  padding: 14px 18px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

header.top .mark {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 22px;
  line-height: 1;
}

header.top .name {
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #c9d2d8;
  text-transform: uppercase;
}

header.top .spacer { flex: 1; }

header.top button.icon-btn {
  background: none;
  border: none;
  color: #c9d2d8;
  font-size: 13px;
  padding: 4px 8px;
}

main {
  flex: 1;
  padding: 20px 18px 60px;
}

/* ---- home ---- */

.stat-row {
  display: flex;
  gap: 22px;
  margin-bottom: 18px;
}

.stat {
  flex: 1;
}

.stat .n {
  font-size: 28px;
  font-weight: 600;
  line-height: 1;
}

.stat .l {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
}

button.primary {
  display: block;
  width: 100%;
  background: var(--red);
  color: #fff;
  border: none;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 2px;
  margin-bottom: 10px;
}

button.primary:disabled {
  background: var(--border-strong);
  color: #fff;
  cursor: default;
}

button.secondary {
  display: block;
  width: 100%;
  background: none;
  border: 1px solid var(--border-strong);
  color: var(--ink);
  padding: 12px;
  font-size: 14px;
  border-radius: 2px;
  margin-bottom: 10px;
}

.hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 22px 0 16px;
}

.section-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  margin-bottom: 10px;
}

/* genkouyoushi grid — the signature element */

.kgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
  gap: 3px;
}

.kgrid .cell {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
}

.kgrid .cell::before,
.kgrid .cell::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-color: var(--border-strong);
  opacity: 0.6;
}

.kgrid .cell::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
.kgrid .cell::after { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

.kgrid .cell.locked { opacity: 0.28; background: var(--paper); }

/* ---- review card ---- */

.card-frame {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  padding: 40px 20px;
  margin-bottom: 18px;
  position: relative;
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.card-frame::before,
.card-frame::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-color: var(--border-strong);
}

.card-frame::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
.card-frame::after { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

.prompt-label {
  position: absolute;
  top: 10px;
  left: 14px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}

.streak-tag {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
}

.prompt-main {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 42px;
}

.prompt-main.small {
  font-size: 22px;
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4;
}

.stamp {
  position: absolute;
  right: 18px;
  bottom: 12px;
  width: 54px;
  height: 54px;
  pointer-events: none;
}

.stamp svg { width: 100%; height: 100%; }

input.answer {
  display: block;
  width: 100%;
  border: none;
  border-bottom: 2px solid var(--ink);
  background: none;
  font-size: 20px;
  padding: 8px 4px;
  margin-bottom: 14px;
  color: var(--ink);
}

input.answer:focus { outline: none; border-color: var(--red); }

.feedback-block {
  margin-bottom: 16px;
  font-size: 15px;
}

.feedback-block .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.feedback-block .row .l { color: var(--ink-soft); font-size: 13px; }

.rate-row {
  display: flex;
  gap: 8px;
}

.rate-row button {
  flex: 1;
  padding: 12px 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 14px;
  border-radius: 2px;
}

.rate-row button.hard { border-color: #a67a2a; }
.rate-row button.good { border-color: var(--indigo-soft); }
.rate-row button.easy { border-color: var(--red); }

.teach-body {
  margin-bottom: 18px;
}

.teach-body .compound-row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  align-items: baseline;
}

.teach-body .compound-row .w {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 20px;
  min-width: 74px;
}

.teach-body .compound-row .r {
  color: var(--ink-soft);
  font-size: 13px;
  min-width: 70px;
}

.teach-body .compound-row .m {
  font-size: 14px;
}

.progress-line {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 10px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-soft);
}

.empty-state .mark {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 34px;
  color: var(--ink);
  margin-bottom: 10px;
}

.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.settings-row input[type=number] {
  width: 64px;
  border: 1px solid var(--border-strong);
  padding: 6px;
  font-size: 14px;
  text-align: right;
}

@media (max-width: 420px) {
  .prompt-main { font-size: 34px; }
}
</style>

const APP_VERSION = '3.0.0';
const DIRS = { WM: 'wm', WR: 'wr', MW: 'mw' };
const GROUP_SIZE = 10;
const MASTERY_STREAK = 5;
const COOLDOWN = 5; // minimum questions between repeats of the same card in practice

let cards = {};
let currentDay = 1;
let session = null;

function key(wordId, dir) { return wordId + ':' + dir; }
function wordById(id) { return WORDS[id]; }

function load() {
  try { cards = JSON.parse(localStorage.getItem('kv_cards')) || {}; } catch (e) { cards = {}; }
  try { currentDay = parseInt(localStorage.getItem('kv_day'), 10) || 1; } catch (e) { currentDay = 1; }
  try { session = JSON.parse(localStorage.getItem('kv_session')) || null; } catch (e) { session = null; }
}

function saveCards() { localStorage.setItem('kv_cards', JSON.stringify(cards)); }
function saveDay() { localStorage.setItem('kv_day', String(currentDay)); }
function saveSession() {
  if (session) localStorage.setItem('kv_session', JSON.stringify(session));
  else localStorage.removeItem('kv_session');
}

function totalDays() { return Math.ceil(KANJI.length / GROUP_SIZE); }
function dayRange(d) {
  const start = (d - 1) * GROUP_SIZE;
  const end = Math.min(d * GROUP_SIZE, KANJI.length);
  return KANJI.slice(start, end);
}
function cumulativeKanji(d) { return KANJI.slice(0, Math.min(d * GROUP_SIZE, KANJI.length)); }

function dayWords(d) {
  const out = [];
  dayRange(d).forEach(k => (KANJI_WORDS[k] || []).forEach(id => out.push(WORDS[id])));
  return out;
}

function untaughtDayWords(d) {
  return dayWords(d).filter(w => !cards[key(w.id, DIRS.WM)]);
}

function isTaught(wordId) { return !!cards[key(wordId, DIRS.WM)]; }

function teachWord(wordId) {
  cards[key(wordId, DIRS.WM)] = { streak: 0 };
  cards[key(wordId, DIRS.WR)] = { streak: 0 };
  cards[key(wordId, DIRS.MW)] = { streak: 0 };
  saveCards();
}

function grade(cardKey, correct) {
  const c = cards[cardKey];
  c.streak = correct ? c.streak + 1 : 0;
  saveCards();
}

function cardScore(card) {
  if (!card) return 0;
  return Math.min(card.streak / MASTERY_STREAK, 1);
}

function kanjiScore(k) {
  const ids = KANJI_WORDS[k] || [];
  let total = 0, sum = 0;
  ids.forEach(id => {
    [DIRS.WM, DIRS.WR, DIRS.MW].forEach(d => {
      const c = cards[key(id, d)];
      if (c) { total++; sum += cardScore(c); }
    });
  });
  return total ? sum / total : 0;
}

function kanjiFullyMastered(k) {
  const ids = KANJI_WORDS[k] || [];
  if (!ids.length) return false;
  for (const id of ids) {
    for (const d of [DIRS.WM, DIRS.WR, DIRS.MW]) {
      const c = cards[key(id, d)];
      if (!c || c.streak < MASTERY_STREAK) return false;
    }
  }
  return true;
}

function overallMasteredCount() { return KANJI.filter(kanjiFullyMastered).length; }
function dayComplete(d) { return cumulativeKanji(d).every(kanjiFullyMastered); }

// ---- answer checking ----

function normalizeMeaning(s) {
  return s.toLowerCase()
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/^\s*to\s+/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function meaningOk(input, gloss) {
  const norm = normalizeMeaning(input);
  if (!norm) return false;
  const parts = gloss.split(/[,;/]/).map(normalizeMeaning).filter(Boolean);
  return parts.some(p => p === norm || (norm.length > 2 && (p.includes(norm) || norm.includes(p))));
}

function readingOk(input, reading) { return input.replace(/\s/g, '') === reading.replace(/\s/g, ''); }
function wordOk(input, word) { return input.replace(/\s/g, '') === word.replace(/\s/g, ''); }

function checkAnswer(item, dir, input) {
  if (dir === DIRS.WM) return meaningOk(input, item.meaning);
  if (dir === DIRS.WR) return readingOk(input, item.reading);
  return wordOk(input, item.word);
}

// ---- practice pool / weighted pick ----

function cumulativeTaughtPairs(d) {
  const ks = cumulativeKanji(d);
  const wordIds = new Set();
  ks.forEach(k => (KANJI_WORDS[k] || []).forEach(id => { if (isTaught(id)) wordIds.add(id); }));
  const pairs = [];
  wordIds.forEach(id => {
    [DIRS.WM, DIRS.WR, DIRS.MW].forEach(d2 => {
      if (cards[key(id, d2)]) pairs.push({ wordId: id, dir: d2 });
    });
  });
  return pairs;
}

function weightFor(streak) { return Math.max(1, MASTERY_STREAK - Math.min(streak, MASTERY_STREAK)); }

function pickNextPractice() {
  const pool = cumulativeTaughtPairs(currentDay);
  if (!pool.length) return null;
  const turn = session.turn || 0;
  const lastAsked = session.lastAsked || {};
  let candidates = pool.filter(p => {
    const t = lastAsked[key(p.wordId, p.dir)];
    return t === undefined || (turn - t) >= COOLDOWN;
  });
  if (!candidates.length) {
    candidates = pool.slice().sort((a, b) => {
      const ta = lastAsked[key(a.wordId, a.dir)] ?? -1;
      const tb = lastAsked[key(b.wordId, b.dir)] ?? -1;
      return ta - tb;
    }).slice(0, Math.max(1, Math.ceil(pool.length / 3)));
  }
  const weights = candidates.map(p => weightFor(cards[key(p.wordId, p.dir)].streak));
  const totalW = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * totalW;
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i];
  }
  return candidates[candidates.length - 1];
}

const app = document.getElementById('app');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  app.innerHTML = '';
  app.appendChild(header());
  const main = el('main');
  app.appendChild(main);

  if (session && session.mode === 'learn') renderLearn(main);
  else if (session && session.mode === 'practice') renderPractice(main);
  else { session = null; saveSession(); renderHome(main); }
}

  const h = el('header', 'top');
  h.appendChild(el('span', 'mark', '漢'));
  h.appendChild(el('span', 'name', 'Kanji'));
  h.appendChild(el('div', 'spacer'));
  if (session) {
    const exit = el('button', 'icon-btn', 'Exit');
    exit.onclick = () => { session = null; saveSession(); render(); };
    h.appendChild(exit);
  } else {
    const settingsBtn = el('button', 'icon-btn', 'Settings');
    settingsBtn.onclick = renderSettingsScreen;
    h.appendChild(settingsBtn);
  }
  return h;
}

  const row = el('div', 'stat-row');

  } else {
    main.appendChild(el('div', 'progress-line', 'All of day ' + currentDay + ' introduced.'));

  const hasTaught = Object.keys(cards).length > 0;
  const practiceBtn = el('button', hasTaught ? 'primary' : 'secondary', 'Practice');
  practiceBtn.disabled = !hasTaught;
  practiceBtn.onclick = startPractice;
  main.appendChild(practiceBtn);

  if (dayComplete(currentDay) && currentDay < totalDays()) {
    const nextBtn = el('button', 'secondary', 'Move to day ' + (currentDay + 1));
    nextBtn.style.borderColor = '#b8002a';
    nextBtn.onclick = () => { currentDay++; saveDay(); render(); };
    main.appendChild(nextBtn);
  }

  main.appendChild(el('hr', 'hr'));
  main.appendChild(el('div', 'section-label', 'Progress — ' + KANJI.length + ' kanji'));

  const grid = el('div', 'kgrid');
  const unlockedCount = currentDay * GROUP_SIZE;
  KANJI.forEach((k, idx) => {
    const cell = el('div', 'cell', k);
    if (idx >= unlockedCount) {
      cell.classList.add('locked');
    } else {
      const avg = kanjiScore(k);
      cell.style.background = shadeFor(avg);
      if (avg > 0.5) cell.style.color = '#fdfcf8';
    }
    grid.appendChild(cell);
  });
  main.appendChild(grid);
}

function shadeFor(avg) {
  if (avg <= 0) return '#fdfcf8';
  const from = [242, 218, 222];
  const to = [184, 0, 42];
  const rgb = from.map((v, i) => Math.round(v + (to[i] - v) * avg));
  return 'rgb(' + rgb.join(',') + ')';
}

// ---- shared question UI ----

function streakTag(cardKey) {
  const c = cards[cardKey];
  const s = c ? c.streak : 0;
  return el('div', 'streak-tag', 'streak ' + Math.min(s, MASTERY_STREAK) + '/' + MASTERY_STREAK);
}

function stampSvg(correct) {
  if (correct) return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#b8002a" stroke-width="6"/></svg>';
  return '<svg viewBox="0 0 100 100"><line x1="18" y1="18" x2="82" y2="82" stroke="#b8002a" stroke-width="6"/><line x1="82" y1="18" x2="18" y2="82" stroke="#b8002a" stroke-width="6"/></svg>';
}

function promptLabel(dir) {
  if (dir === DIRS.WM) return 'word';
  if (dir === DIRS.WR) return 'reading of';
  return 'meaning';
}

function renderQuestion(main, wordId, dir, onDone) {
  const word = wordById(wordId);
  const cardKey = key(wordId, dir);
  const frame = el('div', 'card-frame');
  frame.appendChild(streakTag(cardKey));
  frame.appendChild(el('div', 'prompt-label', promptLabel(dir)));
  const promptText = (dir === DIRS.WM || dir === DIRS.WR) ? word.word : word.meaning;
  const small = dir === DIRS.MW;
  frame.appendChild(el('div', 'prompt-main' + (small ? ' small' : ''), promptText));
  main.appendChild(frame);

  if (!session.answered) {
    const input = el('input', 'answer');
    input.type = 'text';
    input.autocomplete = 'off';
    input.autocapitalize = 'off';
    input.placeholder = dir === DIRS.WM ? 'meaning (english)' : dir === DIRS.WR ? 'reading (hiragana)' : 'word (kanji)';
    main.appendChild(input);
    setTimeout(() => input.focus(), 30);

    const submit = () => {
      const val = input.value.trim();
      if (!val) return;
      const correct = checkAnswer(word, dir, val);
      session.answered = true;
      session.lastResult = { input: val, correct };
      saveSession();
      render();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    const btn = el('button', 'primary', 'Check');
    btn.onclick = submit;
    main.appendChild(btn);
  } else {
    const result = session.lastResult;
    const stamp = el('div', 'stamp');
    stamp.innerHTML = stampSvg(result.correct);
    frame.appendChild(stamp);

    const block = el('div', 'feedback-block');
    const rows = [['word', word.word], ['reading', word.reading], ['meaning', word.meaning]];
    if (!result.correct) rows.push(['you wrote', result.input]);
    rows.forEach(pair => {
      const r = el('div', 'row');
      r.appendChild(el('span', 'l', pair[0]));
      r.appendChild(el('span', '', pair[1]));
      block.appendChild(r);
    });
    main.appendChild(block);

    const cont = el('button', 'primary', 'Continue');
    cont.onclick = () => onDone(result.correct);
    main.appendChild(cont);
  }
}

// ---- learn mode (sequential, in day order, FRQ) ----

function startLearn() {
  const words = untaughtDayWords(currentDay);
  session = { mode: 'learn', words: words.map(w => w.id), idx: 0, phase: 'teach', answered: false, lastResult: null };
  saveSession();
  render();
}

function renderLearn(main) {
  if (session.idx >= session.words.length) { session = null; saveSession(); render(); return; }
  const wordId = session.words[session.idx];
  const word = wordById(wordId);
  main.appendChild(el('div', 'progress-line', (session.idx + 1) + ' of ' + session.words.length + ' — day ' + currentDay));

  if (session.phase === 'teach') {
    const frame = el('div', 'card-frame');
    frame.appendChild(el('div', 'prompt-label', 'new'));
    frame.appendChild(el('div', 'prompt-main', word.word));
    main.appendChild(frame);

    const body = el('div', 'teach-body');
    const row = el('div', 'compound-row');
    row.appendChild(el('span', 'w', word.word));
    row.appendChild(el('span', 'r', word.reading));
    row.appendChild(el('span', 'm', word.meaning));
    body.appendChild(row);
    main.appendChild(body);

    const btn = el('button', 'primary', 'Got it');
    btn.onclick = () => {
      teachWord(wordId);
      session.phase = 'quiz';
      session.answered = false;
      session.lastResult = null;
      saveSession();
      render();
    };
    main.appendChild(btn);
  } else {
    renderQuestion(main, wordId, DIRS.MW, correct => {
      grade(key(wordId, DIRS.MW), correct);
      session.idx++;
      session.phase = 'teach';
      session.answered = false;
      session.lastResult = null;
      saveSession();
      render();
    });
  }
}

// ---- practice mode (weighted-random, cumulative, FRQ) ----

function startPractice() {
  session = { mode: 'practice', turn: 0, lastAsked: {}, current: null, answered: false, lastResult: null };
  advancePractice();
}

function advancePractice() {
  const pick = pickNextPractice();
  if (!pick) { session = null; saveSession(); render(); return; }
  session.current = pick;
  session.answered = false;
  session.lastResult = null;
  session.lastAsked[key(pick.wordId, pick.dir)] = session.turn;
  saveSession();
  render();
}

function renderPractice(main) {
  main.appendChild(el('div', 'progress-line', 'practice — question ' + (session.turn + 1)));
  const { wordId, dir } = session.current;
  renderQuestion(main, wordId, dir, correct => {
    grade(key(wordId, dir), correct);
    session.turn++;
    advancePractice();
  });
}

// ---- import / export / reset ----

function exportString() {
  const parts = [];
  for (const k in cards) parts.push(k + '.' + cards[k].streak);
  const raw = 'v2|' + currentDay + '|' + parts.join(';');
  return btoa(raw);
}

function importString(str) {
  const raw = atob(str.trim());
  const segs = raw.split('|');
  const day = parseInt(segs[1], 10) || 1;
  const blob = segs[2] || '';
  const newCards = {};
  if (blob) {
    blob.split(';').forEach(p => {
      const lastDot = p.lastIndexOf('.');
      const k = p.slice(0, lastDot);
      const streak = parseInt(p.slice(lastDot + 1), 10) || 0;
      newCards[k] = { streak };
    });
  }
  cards = newCards;
  currentDay = day;
  saveCards(); saveDay();
  session = null; saveSession();
}

function renderSettingsScreen() {
  app.innerHTML = '';
  const h = el('header', 'top');
  h.appendChild(el('span', 'mark', '漢'));
  h.appendChild(el('span', 'name', 'Settings'));
  h.appendChild(el('div', 'spacer'));
  const back = el('button', 'icon-btn', 'Done');
  back.onclick = render;
  h.appendChild(back);
  app.appendChild(h);

  const main = el('main');
  app.appendChild(main);

  main.appendChild(el('div', 'section-label', 'Currently on day ' + currentDay + ' of ' + totalDays()));

  main.appendChild(el('hr', 'hr'));
  main.appendChild(el('div', 'section-label', 'Export progress'));
  const exportArea = document.createElement('textarea');
  exportArea.readOnly = true;
  exportArea.value = exportString();
  exportArea.style.cssText = 'width:100%;height:70px;font-size:11px;padding:8px;border:1px solid var(--border-strong);margin-bottom:10px;word-break:break-all;';
  main.appendChild(exportArea);
  const copyBtn = el('button', 'secondary', 'Select all');
  copyBtn.onclick = () => { exportArea.focus(); exportArea.select(); };
  main.appendChild(copyBtn);

  main.appendChild(el('hr', 'hr'));
  main.appendChild(el('div', 'section-label', 'Import progress'));
  const importArea = document.createElement('textarea');
  importArea.placeholder = 'paste code here';
  importArea.style.cssText = 'width:100%;height:70px;font-size:11px;padding:8px;border:1px solid var(--border-strong);margin-bottom:10px;word-break:break-all;';
  main.appendChild(importArea);
  const importBtn = el('button', 'secondary', 'Import (overwrites current data)');
  importBtn.onclick = () => {
    if (!importArea.value.trim()) return;
    if (!confirm('This replaces all current progress on this device. Continue?')) return;
    try {
      importString(importArea.value);
      renderSettingsScreen();
    } catch (e) {
      alert('Could not read that code.');
    }
  };
  main.appendChild(importBtn);

  main.appendChild(el('hr', 'hr'));
  const resetBtn = el('button', 'secondary', 'Reset all data');
  resetBtn.style.borderColor = '#b8002a';
  resetBtn.style.color = '#b8002a';
  resetBtn.onclick = () => {
    if (!confirm('This permanently erases all progress on this device. Continue?')) return;
    if (!confirm('Are you sure? This cannot be undone.')) return;
    cards = {}; currentDay = 1; session = null;
    saveCards(); saveDay(); saveSession();
    renderSettingsScreen();
  };
  main.appendChild(resetBtn);
}

// ---- boot ----

load();
render();

</script>
